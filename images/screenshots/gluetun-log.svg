  <circle cx="26" cy="23" r="7" fill="#e0645a" opacity="0.85"/>
  <circle cx="48" cy="23" r="7" fill="#e0b04a" opacity="0.85"/>
  <circle cx="70" cy="23" r="7" fill="#5fb87a" opacity="0.85"/>
  <text x="450" y="28" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#8b949e">terminal</text>

  <rect x="0" y="46" width="900" height="354" fill="#000000"/>

  <g font-family="Menlo, Consolas, monospace" font-size="13">
    <text x="26" y="82" fill="#e8833a">$ docker compose -f stack/docker-compose.yml logs gluetun</text>
    <text x="26" y="114" fill="#8b949e">gluetun  | 2026-08-18T09:14:02Z INFO [vpn] initializing OpenVPN client</text>
    <text x="26" y="140" fill="#8b949e">gluetun  | 2026-08-18T09:14:04Z INFO [firewall] allowing VPN connection</text>
    <text x="26" y="166" fill="#8b949e">gluetun  | 2026-08-18T09:14:05Z INFO [ip getter] public IP address is 203.0.113.42</text>
    <text x="26" y="192" fill="#5fb87a" font-weight="bold">gluetun  | 2026-08-18T09:14:05Z INFO [vpn] Connected</text>
    <text x="26" y="224" fill="#c9c9c9">-- qBittorrent shares this container's network namespace: no "Connected"</text>
    <text x="26" y="248" fill="#c9c9c9">   line above means qBittorrent has no network access at all (fails</text>
    <text x="26" y="272" fill="#c9c9c9">   closed, not open) -- check this before anything else if downloads stall.</text>
  </g>

  <text x="450" y="378" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#6e7681">Representative mockup, not a literal capture - real log lines/timestamps will differ</text>
