name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Vulcan with dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint (pyflakes-only - real bugs, not this project's own deliberate style)
        run: ruff check .

      - name: Run tests
        run: pytest tests/ -v --cov=installer --cov-report=term-missing

      - name: Install whiptail, shellcheck, bats, tmux
        run: sudo apt-get update && sudo apt-get install -y whiptail shellcheck bats tmux

      - name: Shellcheck installer/menu.sh
        # -S warning, not the default (which also flags style/info
        # suggestions) - same "real bugs, not style debates" scoping
        # this project already applies to ruff (see pyproject.toml).
        run: shellcheck -S warning installer/menu.sh

      - name: Shellcheck install bootstrap
        run: shellcheck -S warning install

      - name: Bats tests for installer/menu.sh
        run: bats tests/test_menu.bats

      - name: Bats tests for install bootstrap
        run: bats tests/test_install.bats

      - name: Bats real-pty tests for installer/menu.sh (tmux + real whiptail)
        # `vulcan` is already on PATH from the editable install above;
        # the pty harness picks it up via its command -v fallback.
        run: bats tests/test_menu_pty.bats
