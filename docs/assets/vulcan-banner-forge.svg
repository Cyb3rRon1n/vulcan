<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="250" viewBox="0 0 720 250" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="250" fill="#0d0d0d"/>
  <!-- Forge pattern background -->
  <g fill="#1a1a1a">
    <line x1="0" y1="0" x2="720" y2="250" stroke="#2a2a2a" stroke-width="1"/>
    <line x1="360" y1="0" x2="0" y2="250" stroke="#2a2a2a" stroke-width="1"/>
  </g>
  <!-- GPU heat bar -->
  <g fill="#ff6b6b" transform="translate(50, 180)">
    <rect width="40" height="40" rx="5"/>
    <rect x="60" width="40" height="40" rx="5"/>
    <rect x="120" width="40" height="40" rx="5"/>
  </g>
  <!-- CPU core indicators -->
  <g fill="#ffa502" transform="translate(200, 180)">
    <circle cx="20" cy="20" r="6"/>
    <circle cx="40" cy="20" r="6"/>
    <circle cx="60" cy="20" r="6"/>
    <circle cx="80" cy="20" r="6"/>
  </g>
  <!-- VULCAN text -->
  <text x="360" y="60" font-family="Georgia, serif" font-size="48" font-weight="300" letter-spacing="8" fill="#e8e8e8" text-anchor="middle">VULCAN</text>
  <!-- Media Stack tag -->
  <text x="360" y="100" font-family="Arial, sans-serif" font-size="20" fill="#aaa" text-anchor="middle">Media Stack Forge</text>
  <!-- Tier info -->
  <text x="360" y="140" font-family="Arial, sans-serif" font-size="14" fill="#666" text-anchor="middle">Light · Medium · Heavy</text>
  <!-- Service count -->
  <text x="360" y="160" font-family="Arial, sans-serif" font-size="14" fill="#666" text-anchor="middle">17 Services</text>
  <!-- GPU transcription note -->
  <text x="360" y="190" font-family="Arial, sans-serif" font-size="12" fill="#555" text-anchor="middle">GPU Transcoding: Supported</text>
  <!-- Docker container silhouettes -->
  <g fill="#ff6b6b" transform="translate(60, 210)">
    <rect width="30" height="20" rx="3"/>
    <rect x="45" width="30" height="20" rx="3"/>
    <rect x="80" width="30" height="20" rx="3"/>
    <rect x="115" width="30" height="20" rx="3"/>
  </g>
</svg>