<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <style>
    .anvil { fill: #2f7a8c; }
    .spark { fill: #c23b3b; }
    @media (prefers-color-scheme: dark) {
      .anvil { fill: #5cd6d6; }
      .spark { fill: #e0645a; }
    }
  </style>
  <!-- anvil body -->
  <path class="anvil" d="M10 40 h20 l4 -6 h16 a4 4 0 0 1 4 4 v4 h-44 z"/>
  <rect class="anvil" x="24" y="38" width="10" height="14" rx="1.5"/>
  <rect class="anvil" x="18" y="50" width="22" height="6" rx="1.5"/>
  <!-- spark/flame above the anvil -->
  <path class="spark" d="M29 10 c3 5 6 8 6 13 a6 6 0 0 1 -12 0 c0 -3 2 -5 3 -7 c0.5 2 1.5 2.5 1.5 3.5 c0 -3.5 0.5 -6.5 1.5 -9.5 z"/>
</svg>
