[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vulcan-forge"
version = "0.1.0-alpha"
description = "An intelligent media stack forge - inspects your system and builds a tailored Jellyfin + *arr homelab."
readme = "README.md"
requires-python = ">=3.11"

authors = [
{name = "Vulcan Contributors"}
]

license = {file = "LICENSE"}

keywords = [
"homelab",
"jellyfin",
"arr-stack",
"docker",
"self-hosted",
"media-server"
]

classifiers = [
"Development Status :: 2 - Pre-Alpha",
"Intended Audience :: End Users/Desktop",
"License :: OSI Approved :: MIT License",
"Programming Language :: Python :: 3",
"Programming Language :: Python :: 3.11",
"Programming Language :: Python :: 3.12",
"Operating System :: POSIX :: Linux",
"Topic :: System :: Installation/Setup"
]

dependencies = [
    "typer",
    "rich",
    "textual",
    "psutil",
    "jinja2",
    "pyyaml"
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "pytest-asyncio", "ruff"]

[project.scripts]
vulcan = "installer.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["installer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Deliberately narrow, not ruff's "ALL" or a preset like "strict" -
# selected to catch real bugs/hygiene issues without fighting this
# project's documented style choices (heavy vertical spacing, sparse
# docstrings, no forced type annotations, natural `assert` in tests).
#   E4/E7/E9 - pycodestyle error subset (imports, statements, syntax)
#   F        - pyflakes (unused imports/vars, undefined names, etc.)
#   B        - flake8-bugbear (real bug-prone patterns, e.g. B904)
#   I        - isort (import sorting/grouping)
#   UP       - pyupgrade (modernize syntax for the Python floor this
#              project actually supports, >=3.11)
# Deliberately excluded: D (docstrings), ANN (type annotations),
# S101 (assert), FBT (boolean-arg style), COM812 (trailing commas),
# C4 (comprehension style - C408 would churn dict(...) calls used
# throughout the test suite's shared helpers for no functional gain).
select = ["E4", "E7", "E9", "F", "B", "I", "UP"]
