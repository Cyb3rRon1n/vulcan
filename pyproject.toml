[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vulcan-forge"
version = "0.1.0-alpha"
description = "An intelligent media stack forge - inspects your system and builds a tailored Jellyfin + *arr homelab."
readme = "README.md"
requires-python = ">=3.11"

authors = [
{name = "Vulcan Contributors"}
]

license = {file = "LICENSE"}

keywords = [
"homelab",
"jellyfin",
"arr-stack",
"docker",
"self-hosted",
"media-server"
]

classifiers = [
"Development Status :: 2 - Pre-Alpha",
"Intended Audience :: End Users/Desktop",
"License :: OSI Approved :: MIT License",
"Programming Language :: Python :: 3",
"Programming Language :: Python :: 3.11",
"Programming Language :: Python :: 3.12",
"Operating System :: POSIX :: Linux",
"Topic :: System :: Installation/Setup"
]

dependencies = [
    "typer",
    "rich",
    "psutil",
    "jinja2",
    "pyyaml"
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "pytest-asyncio", "ruff"]
docs = ["mkdocs-material"]

[project.urls]
Homepage = "https://github.com/Cyb3rRon1n/vulcan"
Repository = "https://github.com/Cyb3rRon1n/vulcan"

[project.scripts]
vulcan = "installer.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["installer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint]
# Pyflakes only (F) - real correctness signal (unused imports, unused
# locals, undefined names, etc.), not a style/formatter check. This
# codebase has a deliberate, documented style (heavy vertical spacing,
# see CLAUDE.md's "Code style" section) that a default ruff/Black rule
# set would fight; F-only was confirmed clean against the existing
# codebase before adding this (3 real, now-fixed dead-code hits, zero
# false positives from style rules) rather than assumed safe.
select = ["F"]
